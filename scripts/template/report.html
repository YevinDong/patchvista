<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="theme-color" content="#f6f7f9">
<script>/*__THEME__*/</script>
<style>/*__CSS__*/</style>
</head>
<body>
<a class="skip-link" href="#right">跳到审阅详情</a>
<header id="top">
  <div class="brand">PatchVista</div>
  <h1 id="title" class="title"></h1>
  <div id="stats" class="stats"></div>
  <div class="spacer"></div>
  <div id="progress" class="progress" title="审阅进度"><div class="bar"><i></i></div><span></span></div>
  <div id="themeModes" class="seg theme-modes" role="group" aria-label="外观模式">
    <button type="button" data-theme-mode="light" aria-pressed="false"><span data-icon="sun" aria-hidden="true"></span>白色</button>
    <button type="button" data-theme-mode="dark" aria-pressed="false"><span data-icon="moon" aria-hidden="true"></span>黑色</button>
    <button type="button" data-theme-mode="system" aria-pressed="true"><span data-icon="monitor" aria-hidden="true"></span>系统</button>
  </div>
  <select id="editor" aria-label="打开文件的编辑器" title="点击文件路径时用哪个编辑器打开">
    <option value="vscode">VS Code</option><option value="cursor">Cursor</option>
    <option value="idea">JetBrains</option><option value="none">不跳转</option>
  </select>
</header>
<main>
  <aside id="left" aria-label="审阅导航">
    <nav class="tabs" id="leftTabs">
      <button data-tab="files" class="on" aria-pressed="true"><span data-icon="folder" aria-hidden="true"></span>文件</button>
      <button data-tab="sets" aria-pressed="false"><span data-icon="route" aria-hidden="true"></span>审阅路径</button>
      <button data-tab="risks" aria-pressed="false"><span data-icon="triangle-alert" aria-hidden="true"></span>风险</button>
      <button data-tab="res" aria-pressed="false"><span data-icon="database" aria-hidden="true"></span>资源</button>
    </nav>
    <div class="tabbody" id="leftBody"></div>
  </aside>
  <div id="lsplitter" class="splitter" tabindex="0" role="separator" aria-label="文件面板宽度" aria-orientation="vertical" aria-controls="left" title="拖动或按左右方向键调整宽度；Home 恢复默认"></div>
  <section id="center">
    <div class="toolbar">
      <div class="seg" id="viewSeg">
        <button data-view="module" aria-pressed="true"><span data-icon="layers" aria-hidden="true"></span>模块视图</button>
        <button data-view="entity" aria-pressed="false"><span data-icon="network" aria-hidden="true"></span>实体视图</button>
      </div>
      <div id="crumbs" class="crumbs"></div>
      <div class="spacer"></div>
      <input id="search" name="graph-search" aria-label="搜索函数、文件或资源" placeholder="搜索函数 / 文件 / 资源…" autocomplete="off" spellcheck="false" title="按 / 聚焦搜索，Enter 查看匹配结果">
      <details class="opts" id="ftypeMenu">
        <summary id="ftypeSum"><span id="ftypeLabel">文件类型</span><span data-icon="chevron-down" aria-hidden="true"></span></summary>
        <div class="optsbox"><div class="oh">按后缀筛选（与左侧文件列表联动）</div><div id="gchips" class="fchips"></div></div>
      </details>
      <details class="opts">
        <summary>显示<span data-icon="chevron-down" aria-hidden="true"></span></summary>
        <div class="optsbox">
        <label><input type="checkbox" id="optContext" checked> 未改动的调用方/被调方</label>
        <label><input type="checkbox" id="optRes" checked> 资源（DB/Redis/MQ/配置…）</label>
        <label><input type="checkbox" id="optTests"> 测试</label>
        <label><input type="checkbox" id="optMoves"> 纯移动 / 仅 import 变化</label>
        <label><input type="checkbox" id="optTypes" checked> 类型/接口</label>
        <label>邻居深度 <select id="optDepth"><option>1</option><option>2</option></select></label>
        </div>
      </details>
      <button id="fit" aria-label="适应窗口" title="适应窗口"><span data-icon="maximize" aria-hidden="true"></span></button>
    </div>
    <div id="cy" role="img" aria-label="改动关系图；可通过文件和审阅路径访问对应实体详情"></div>
    <div id="legend"></div>
    <div id="busy" role="status" hidden>布局中…</div>
    <div id="empty" role="status" hidden></div>
  </section>
  <div id="splitter" class="splitter" tabindex="0" role="separator" aria-label="详情面板宽度" aria-orientation="vertical" aria-controls="right" title="拖动或按左右方向键调整宽度；Home 恢复默认"></div>
  <aside id="right" aria-label="审阅详情" tabindex="-1"><div id="detail"></div></aside>
</main>
<script id="icons" type="application/json">__ICONS__</script>
<script id="icon-license" type="text/plain">__ICON_LICENSE__</script>
<script id="data" type="application/json">__DATA__</script>
<script>/*__CYTOSCAPE__*/</script>
<script>/*__ELK__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
